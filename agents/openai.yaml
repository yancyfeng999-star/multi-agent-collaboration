interface:
  display_name: "多智能体协同 | Multi-Agent Collaboration"
  short_description: "多智能体协同 2.2.0：通用模式路由、独立候选串行集成与证据化收口，不增加长期 Agent"
  default_prompt: "使用 $multi-agent-collaboration 先读项目并选择最小路径：单一任务走 Direct/Direct Hotfix；有证据才升级 Reviewed 或 Coordinated。项目适配层可选提供 Integration Policy；无关候选并行评估，唯一 Integration Lane 串行集成，Release Freeze、六层证据和 worktree 收口保持 fail-closed；资料保存在项目外 Governance Home，高风险门禁不降低。"
